    <text x="70" y="246" font-size="15" fill="#475569">t=0（噪声）</text>
    <text x="360" y="246" text-anchor="middle" font-size="14" fill="#2563eb">沿流线积分（解常微分方程）</text>
    <text x="650" y="246" text-anchor="end" font-size="15" fill="#ea580c">t=1（动作）</text>
    <text x="694" y="272" text-anchor="end" font-size="13" fill="#475569">与扩散的区别：不预测噪声，直接学速度；同样要迭代多步积分</text>
    <rect x="40" y="284" width="640" height="40" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <text x="360" y="309" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">流匹配 = 学一张速度地图，从噪声出发顺着箭头走到动作</text>
  </g>
