    <text x="360" y="50" text-anchor="middle" font-size="15" font-weight="700" fill="#2563eb">速度场 v_θ(x,t)：每个位置告诉你「往哪走、走多快」</text>
    <ellipse cx="92" cy="122" rx="46" ry="50" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
