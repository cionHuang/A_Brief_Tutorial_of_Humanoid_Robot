    <text x="626" y="196" text-anchor="middle" font-size="18" font-weight="700" fill="#ea580c">动作</text>
    <line x1="70" y1="222" x2="650" y2="222" stroke="#94a3b8" stroke-width="2.5"/>
    <path d="M650,216 L662,222 L650,228 Z" fill="#94a3b8"/>
    <line x1="70" y1="214" x2="70" y2="230" stroke="#94a3b8" stroke-width="2"/>
