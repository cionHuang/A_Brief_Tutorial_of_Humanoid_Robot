      <rect x="107" y="150" width="58" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/>
      <text x="136" y="178" text-anchor="middle" font-size="20" fill="#0f172a">猫</text>
      <rect x="171" y="150" width="58" height="44" rx="8" fill="#ffffff" stroke="#94a3b8"/>
      <text x="200" y="178" text-anchor="middle" font-size="20" fill="#0f172a">坐</text>
      <rect x="235" y="150" width="58" height="44" rx="8" fill="#ffffff" stroke="#94a3b8"/>
