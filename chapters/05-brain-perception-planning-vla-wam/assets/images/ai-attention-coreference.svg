    <path d="M520,148 C476,92 436,92 392,148" fill="none" stroke="#94a3b8" stroke-width="2.5"/>

    <g>
      <rect x="308" y="42" width="40" height="24" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
