      <rect x="404" y="58" width="40" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="424" y="76" text-anchor="middle" font-size="16" fill="#475569">0.1</text>
      <rect x="442" y="88" width="40" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="462" y="106" text-anchor="middle" font-size="16" fill="#475569">0.1</text>
    </g>

    <g stroke-width="2">
      <rect x="43" y="150" width="58" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/>
