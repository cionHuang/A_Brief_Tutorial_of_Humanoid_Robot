    <circle cx="520" cy="148" r="5" fill="#ea580c"/>

    <text x="40" y="228" text-anchor="start" font-size="16" fill="#475569">示意图：不是某个真实模型的注意力输出</text>
    <text x="680" y="228" text-anchor="end" font-size="16" fill="#475569">线越粗 = 注意力权重越大</text>

    <rect x="40" y="248" width="640" height="40" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="360" y="274" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">注意力 = 让序列里每个 token 互相看一遍，按相关度加权取信息</text>
